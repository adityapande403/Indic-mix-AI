[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "indicmix"
version = "0.1.0"
description = "Lightweight Code-Mixed Indic Language Understanding, Moderation, and Normalization"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "IndicMix AI Research Team"}
]
keywords = ["indic", "code-mixing", "hinglish", "telgish", "benglish", "nlp", "moderation", "pii", "normalization", "onnx"]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "onnxruntime>=1.17.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.0",
    "scikit-learn>=1.4.0",
    "pyyaml>=6.0.1",
    "regex>=2024.4.16"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "onnx>=1.15.0",
    "ruff>=0.4.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
